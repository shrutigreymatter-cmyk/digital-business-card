<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#20dfc0" />
  <title>Digital Business Card</title>
  <style>
    :root { --mint: #20dfc0; --green: #079f86; --ink: #17151b; --muted: #666774; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #f4f7f6; color: var(--ink); font-family: Arial, Helvetica, sans-serif; }
    .page { width: 100%; max-width: 760px; min-height: 100vh; margin: 0 auto; padding: 28px 20px 34px; background: var(--mint); }
    .profile { display: flex; justify-content: center; padding: 6px 0 28px; }
    .avatar { width: 150px; height: 150px; border-radius: 50%; border: 7px solid rgba(0, 130, 115, .18); background: linear-gradient(145deg, #f5fffc, #bcefe5); display: grid; place-items: center; color: #087e6c; font-weight: 700; font-size: 42px; box-shadow: 0 2px 8px #078d7b22; }
    .card { background: white; border-radius: 10px; margin: 0 0 14px; box-shadow: 0 2px 5px #087e6c20; }
    .intro { text-align: center; padding: 34px 18px 30px; }
    .role { margin: 0 0 22px; color: var(--muted); font-weight: 700; font-size: clamp(15px, 3.2vw, 23px); line-height: 1.35; }
    h1 { margin: 0 0 30px; font-size: clamp(27px, 5vw, 39px); line-height: 1.2; }
    .add-contact { display: inline-block; border: 0; border-radius: 40px; padding: 17px 42px; background: var(--green); color: white; text-decoration: none; font-weight: 700; font-size: 19px; cursor: pointer; }
    .quick-links { display: flex; justify-content: center; gap: 54px; margin-top: 30px; }
    .quick-links a { color: var(--green); text-decoration: none; display: inline-flex; }
    .quick-links svg { width: 34px; height: 34px; stroke: currentColor; fill: none; stroke-width: 2.7; stroke-linecap: round; stroke-linejoin: round; }
    .detail { display: flex; align-items: center; gap: 25px; padding: 20px 25px; min-height: 110px; }
    .icon-box { flex: 0 0 68px; width: 68px; height: 68px; display: grid; place-items: center; border-radius: 9px; background: #dcf3ee; color: var(--green); }
    .icon-box svg { width: 34px; height: 34px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .detail-label { margin: 0 0 8px; color: var(--muted); font-size: 19px; font-weight: 700; }
    .detail-value { margin: 0; font-size: clamp(16px, 3.2vw, 22px); line-height: 1.35; overflow-wrap: anywhere; }
    .detail-value a { color: inherit; text-decoration: none; }
    .social { text-align: center; padding: 20px 0 0; }
    .linkedin { display: inline-grid; place-items: center; width: 42px; height: 42px; border-radius: 5px; color: #111; font-size: 34px; font-weight: 800; text-decoration: none; }
    @media (max-width: 420px) { .page { padding: 20px 12px 28px; } .avatar { width: 128px; height: 128px; } .detail { gap: 16px; padding: 17px 15px; min-height: 96px; } .icon-box { flex-basis: 58px; width: 58px; height: 58px; } .intro { padding: 28px 12px; } .add-contact { padding: 15px 32px; } }
  </style>
</head>
<body>
  <main class="page">
    <div class="profile"><div class="avatar" aria-label="Profile photo placeholder">MA</div></div>
    <section class="card intro">
      <p class="role">DIRECTOR - MARKETING AND PARTNERSHIPS</p>
      <h1>Mukul Ayachit</h1>
      <a class="add-contact" href="#" id="saveContact">add contact</a>
      <div class="quick-links">
        <a href="tel:+971503053880" aria-label="Call mobile number"><svg viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2A19.8 19.8 0 0 1 11.2 19a19.4 19.4 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 2 .7 2.9a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.2-1.3a2 2 0 0 1 2.1-.5c.9.3 1.9.6 2.9.7a2 2 0 0 1 1.8 2.1z"/></svg></a>
        <a href="mailto:mukul@quadropharma.com" aria-label="Send email"><svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="1"/><path d="m3 6 9 7 9-7"/></svg></a>
      </div>
    </section>
    <section class="card detail"><div class="icon-box"><svg viewBox="0 0 24 24"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M8 5h8M9 18h6"/></svg></div><div><p class="detail-label">Mobile</p><p class="detail-value"><a href="tel:+971503053880">+971503053880</a></p></div></section>
    <section class="card detail"><div class="icon-box"><svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="1"/><path d="m3 6 9 7 9-7"/></svg></div><div><p class="detail-label">Email</p><p class="detail-value"><a href="mailto:mukul@quadropharma.com">mukul@quadropharma.com</a></p></div></section>
    <section class="card detail"><div class="icon-box"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"/></svg></div><div><p class="detail-label">Website</p><p class="detail-value"><a href="https://www.quadropharma.com" target="_blank" rel="noopener">https://www.quadropharma.com</a></p></div></section>
    <section class="card detail"><div class="icon-box"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="14" rx="1"/><path d="M8 7V4h8v3M3 11h18"/></svg></div><div><p class="detail-value" style="font-weight:700;color:var(--muted)">QuadroPharma LLC</p></div></section>
    <div class="social"><a class="linkedin" href="https://www.linkedin.com" target="_blank" rel="noopener" aria-label="LinkedIn">in</a></div>
  </main>
  <script>
    // Edit the details below to make this card your own.
    document.getElementById('saveContact').addEventListener('click', function (event) {
      event.preventDefault();
      const vcard = [
        'BEGIN:VCARD','VERSION:3.0','FN:Mukul Ayachit','ORG:QuadroPharma LLC',
        'TITLE:Director - Marketing and Partnerships','TEL;TYPE=CELL:+971503053880',
        'EMAIL:mukul@quadropharma.com','URL:https://www.quadropharma.com','END:VCARD',''
      ].join('\r\n');
      const blob = new Blob([vcard], { type: 'text/vcard;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a'); link.href = url; link.download = 'Mukul-Ayachit.vcf';
      document.body.appendChild(link); link.click(); link.remove(); URL.revokeObjectURL(url);
    });
  </script>
</body>
</html>
